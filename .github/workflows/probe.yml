# TEMPORARY dev aid (removed before merge): prints Minecraft API sources/data for the dev container,
# which can't reach the Minecraft and NeoForge download hosts.
name: Probe

on:
  push:
    branches: [phase-5-boss]
    paths: ['scripts/ci/**', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts
      - name: Probe
        run: bash scripts/ci/probe.sh
