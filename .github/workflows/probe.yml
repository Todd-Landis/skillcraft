# TEMPORARY dev aid (removed before merge): boots a real dedicated server once to confirm the
# arena dimension loads (the GameTest server never creates datapack dimensions).
name: Probe

on:
  push:
    branches: [phase-5-boss]
    paths: ['scripts/ci/**', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Minecraft artifacts
        run: ./gradlew createMinecraftArtifacts -q
      - name: Probe
        run: bash scripts/ci/probe.sh 2>&1 | grep -vE "lambda|synthetic|access\\$" | grep -E "JAVAP|FIND|^[a-z]|screenshot|grab|Screenshot|getSingleplayerServer|gameDirectory|getMainRenderTarget|stop\(|getWindow|performPrefixedCommand|performCommand|createCommandSourceStack|QuickPlay|quickPlay|class " | head -300

  server-smoke:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot dedicated server
        run: bash scripts/ci/server_smoke.sh
