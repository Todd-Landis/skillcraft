name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - name: Check server log for SkillCraft problems
        run: |
          grep -E "\[loot_rates\]" gametest.log || true
          if grep -E "(WARN|ERROR).*(skillcraft|SkillCraft)" gametest.log; then
            echo "::warning::SkillCraft warnings/errors in the GameTest server log (see above)"
          fi
