name: Client smoke

# Starts the real game client (virtual display, software OpenGL), loads a flat world, poses the
# Slagheart boss through every animation, saves screenshots and quits. Catches client-only crashes
# and missing models/textures/animations that the server-side Build job can't see.
# Manual only (Actions tab -> Client smoke -> Run workflow): software rendering is slow, and the
# showcase is quicker to run locally with ./gradlew runClient -Pshowcase -Pworld=showcase.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Showcase scene: empty for the boss, or builds / abilities"
        required: false
        default: ""

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software rendering
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers

      - name: Create a flat test world (dedicated server)
        run: bash scripts/ci/client_smoke.sh world

      - name: Run the client showcase
        run: SCENE="${{ inputs.scene }}" bash scripts/ci/client_smoke.sh client

      - name: Check the client log and screenshots
        run: bash scripts/ci/client_smoke.sh check

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke
          path: |
            run/screenshots/
            run/crash-reports/
            client.log
            server.log
          if-no-files-found: ignore

      - name: Print screenshot previews
        if: always()
        run: java scripts/ci/Preview.java run/screenshots 640 || true
